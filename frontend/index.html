<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Cadastro de Alunos</title>
</head>
<body>

    <div class="container">

        <div class="logo">
            Sistema de Trilhas Educacionais
        </div>

        <h1>Cadastro de Aluno</h1>

        <form id="formAluno">

            <label>Nome:</label>
            <input type="text" id="nome">

            <label>Matrícula:</label>
            <input type="text" id="matricula">

            <label>Turma:</label>
            <input type="text" id="turma">

            <label>Trilha:</label>
            <select id="trilha"></select>

            <button type="submit">
                Cadastrar
            </button>

        </form>

    <p id="mensagem"></p>

    <button onclick="listarAlunos()">
            Ver Alunos
    </button>

    <ul id="listaAlunos"></ul>

    </div>

    <script>

        async function carregarTrilhas() {

            const resposta = await fetch(
                "http://localhost:8080/trilhas"
            );

            const trilhas = await resposta.json();

            const select =
                document.getElementById("trilha");

            trilhas.forEach(trilha => {

                const option =
                    document.createElement("option");

                option.value = trilha.id;
                option.textContent = trilha.nome;

                select.appendChild(option);
            });
        }

        carregarTrilhas();

        document
            .getElementById("formAluno")
            .addEventListener("submit", async function(event){

                event.preventDefault();

                const aluno = {

                    nome:
                        document.getElementById("nome").value,

                    matricula:
                        document.getElementById("matricula").value,

                    turma:
                        document.getElementById("turma").value,

                    trilhaId:
                        Number(
                            document.getElementById("trilha").value
                        )
                };

                const resposta = await fetch(
                    "http://localhost:8080/alunos",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(aluno)
                    }
                );

                const mensagem =
                    document.getElementById("mensagem");

                if(resposta.ok){
                    mensagem.textContent =
                        "Aluno cadastrado com sucesso!";
                }else{
                    mensagem.textContent =
                        "Erro ao cadastrar aluno.";
                }
            });
        async function listarAlunos() {

    const resposta = await fetch(
        "http://localhost:8080/alunos"
    );

    const alunos = await resposta.json();

    const lista = document.getElementById("listaAlunos");

    lista.innerHTML = "";

    alunos.forEach(aluno => {

        lista.innerHTML += `
            <li>
                ${aluno.nome} -
                ${aluno.turma}
            </li>
        `;

    });
    }   

    </script>

</body>
</html>
