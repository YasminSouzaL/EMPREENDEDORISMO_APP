spring.application.name=empreendedorismo
server.port=${PORT:8080}
spring.config.import=optional:file:../.env[.properties]
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:empreendedorismo}}
spring.datasource.username=${DATABASE_USERNAME:${POSTGRES_USER}}
spring.datasource.password=${DATABASE_PASSWORD:${POSTGRES_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true