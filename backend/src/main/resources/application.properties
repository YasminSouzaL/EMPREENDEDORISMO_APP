spring.application.name=empreendedorismo
server.port=${PORT:8080}
spring.config.import=optional:file:./.env.properties
spring.datasource.url=${ENIGMA_DATABASE_URL:jdbc:h2:mem:enigma;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${ENIGMA_DATABASE_USER:sa}
spring.datasource.password=${ENIGMA_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.error.include-message=always
enigma.cors.origins=${ENIGMA_CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5182,https://enigma-admin-eight.vercel.app,https://enigma-student.vercel.app}

enigma.demo.enabled=${ENIGMA_DEMO_ENABLED:false}
enigma.demo.password=${ENIGMA_DEMO_PASSWORD:}
